# CPU dev/pytest planner config: tiny planner over the tiny tokenizer ckpt
# (/tmp/cadence_dryrun2, scales [1,2,4,256]); prompt encoder = bert-tiny (17MB).
run_name: planner_tiny_cpu
seed: 42
model:
  vocab_size: 50257
  seq_len: 256
data:
  dataset: wikitext103        # bin-based loading; tiny synthetic bins for tests
  bin_dir: /tmp/cadence_planner_tiny/data
  limit_windows: 32
  num_workers: 0
planner:
  d_model: 64
  n_layers: 2
  n_heads: 2
  ffn_mult: 2
  cond_drop_p: 0.2
  prompt_encoder: prajjwal1/bert-tiny
  tokenizer_run_dir: /tmp/cadence_dryrun2
  codes_dir: /tmp/cadence_planner_tiny/codes
train:
  max_steps: 6
  batch_size: 4
  micro_batch_size: 4
  lr: 1.0e-3
  warmup_steps: 2
  bf16: false
  log_interval: 2
  eval_interval: 6
  eval_batches: 1
  save_interval: 6
  keep_last: 1
  out_dir: /tmp/cadence_planner_tiny/runs/${run_name}
