# Scale-up tokenizer pilot: 1024-token windows, full geometric ladder with the
# 1->2->4 coarse ramp, full 9.5B-token OWT corpus. RoPE is length-agnostic so
# only config changes vs tokenizer_owt_gpt2.yaml. 25k-step pilots compare
# scale_dropout 0.5 vs 0.3 (deeper 11-scale ladder dilutes per-scale training
# signal; Stage 0's 0.5 verdict does not auto-transfer).
run_name: vqvae_owt9_1024
seed: 42
model:
  vocab_size: 50257
  seq_len: 1024
  d_model: 512
  d_code: 32
  encoder: {num_layers: 6, num_heads: 8}
  decoder: {num_layers: 8, num_heads: 8}
quantizer:
  scales: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024]
  codebook_size: 8192
  revival: {enabled: true, threshold: 1.0, interval: 175}
data:
  dataset: wikitext103            # bin-based contiguous loading
  bin_dir: /tmp/cadence_local/data/owt9_gpt2
  num_workers: 4
train:
  max_steps: 25000                # pilot; full run extends to 150k
  batch_size: 256
  micro_batch_size: 8             # 4x tokens/window vs 256-seq configs
  lr: 3.0e-4
  min_lr_ratio: 0.1
  warmup_steps: 2000
  bf16: true
  bypass_vq_steps: 3000
  scale_dropout_p: 0.5
  log_interval: 50
  eval_interval: 2000
  eval_batches: 30
  save_interval: 4000
  keep_last: 3
  out_dir: /tmp/cadence_local/runs/${run_name}
