# Matched AR baseline (Track 1): decoder-only causal LM, same vocab/data,
# [window t || window t+1] with loss on the continuation half.
run_name: ar_wt103
seed: 42
model:
  vocab_size: 30522
  seq_len: 256             # per window; training sequences are 2x this
  d_model: 768
  decoder: {num_layers: 12, num_heads: 12, ffn_mult: 4}
data:
  dataset: wikitext103
  bin_dir: /tmp/cadence_local/data/wikitext103_bert
  num_workers: 4
planner:
  # only used by generate.py (pairs need the codes npy for indexing parity)
  codes_dir: /tmp/cadence_local/data/codes_hybrid
  tokenizer_run_dir: /tmp/cadence_local/runs/vqvae_wt103_hybrid
train:
  max_steps: 50000
  batch_size: 256
  micro_batch_size: 32
  lr: 3.0e-4
  min_lr_ratio: 0.1
  warmup_steps: 2000
  weight_decay: 0.01
  betas: [0.9, 0.95]
  grad_clip: 1.0
  bf16: true
  log_interval: 50
  eval_interval: 1000
  eval_batches: 30
  save_interval: 2000
  keep_last: 3
  out_dir: /tmp/cadence_local/runs/${run_name}
