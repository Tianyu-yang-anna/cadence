# Controlled-comparison wave (2026-08-29): 2B-token budget on OpenWebText2,
# trunk unified with every baseline family at 12L x 768 x 12h. CFG ON
# (cond_drop_p 0.1, learned null_prefix; sampling may mix cfg != 1).
# 7630 steps x 256 windows x 1024 target tokens = 2.0B loss tokens
# (= Chinchilla-optimal D ~ 20N for ~100M). Paired run:
# planner_prefix_owt2_pqps.yaml — identical except the tokenizer/codes.
run_name: planner_prefix_owt2_pqsh
seed: 42
model:
  vocab_size: 50257
  seq_len: 1024
data:
  dataset: wikitext103
  bin_dir: /tmp/cadence_local/data/owt2_gpt2
  num_workers: 4
planner:
  d_model: 768
  n_layers: 12
  n_heads: 12
  ffn_mult: 4
  cond_drop_p: 0.1                # CFG restored (advisor decision 2026-08-29)
  tokenizer_run_dir: /tmp/cadence_local/runs/vqvae_owt2_1024_pqsh
  codes_dir: /tmp/cadence_local/data/codes_owt2_1024_pqsh
  doc_aware: true
  doc_mode: target
  prompt_mixed: true
  history_max: 0
train:
  max_steps: 7630
  batch_size: 256
  micro_batch_size: 4             # seq 3071 (prefix 1024 + ladder 2047)
  lr: 3.0e-4
  min_lr_ratio: 0.1
  warmup_steps: 400               # scaled to the short schedule
  bf16: true
  log_interval: 50
  eval_interval: 500
  eval_batches: 20
  save_interval: 1000
  keep_last: 3
  out_dir: /tmp/cadence_local/runs/${run_name}
