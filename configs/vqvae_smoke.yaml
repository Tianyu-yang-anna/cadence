# Node smoke test (need.md Step 0 on the real stack): full-size model on a
# 2048-window WikiText-103 subset, 300 steps, heavy overfit expected.
run_name: vqvae_smoke
seed: 42
model:
  vocab_size: 50257
  seq_len: 256
  d_model: 512
  d_code: 32
  encoder: {num_layers: 6, num_heads: 8}
  decoder: {num_layers: 8, num_heads: 8}
quantizer:
  scales: [1, 2, 4, 256]
  codebook_size: 8192
data:
  dataset: wikitext103
  bin_dir: /tmp/cadence_local/data/wikitext103
  limit_windows: 2048
  num_workers: 4
train:
  max_steps: 300
  batch_size: 64
  micro_batch_size: 64
  lr: 3.0e-4
  warmup_steps: 20
  bf16: true
  bypass_vq_steps: 100
  scale_dropout_p: 0.0
  log_interval: 10
  eval_interval: 100
  eval_batches: 8
  save_interval: 150
  keep_last: 2
  out_dir: /tmp/cadence_local/runs/${run_name}
