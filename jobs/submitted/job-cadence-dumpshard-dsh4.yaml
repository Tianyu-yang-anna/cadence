experiment_name: cadence-dumpshard-dsh4
environment:
  dependencies: jobs/requirements.yaml
compute:
  gpus: 8
  gpu_type: GPU_8xH100
max_retries: 0
timeout_minutes: 200
env_variables:
  SHARD: "4"
  NSHARDS: "8"
  RUN_NAME: "pqsh"
  FULL_NAME: "vqvae_owt9_1024_pqsh"
  CONFIG: "configs/tokenizer_owt9_1024_pqsh.yaml"
  DATA_NAME: "owt9_gpt2"
  CODES_NAME: "codes_owt9_1024_pqsh"
code_source:
  type: snapshot
  snapshot:
    repo_path: .
command: |
  bash $CODE_SOURCE_PATH/jobs/dumpshard_entry.sh
