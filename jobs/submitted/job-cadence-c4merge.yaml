experiment_name: cadence-c4merge
environment:
  dependencies: jobs/requirements.yaml
compute:
  gpus: 1
  gpu_type: GPU_1xH100
max_retries: 0
timeout_minutes: 240
env_variables:
  DATA_OUT: "c4_gpt2"
  NSHARDS: "8"
code_source:
  type: snapshot
  snapshot:
    repo_path: .
command: |
  bash $CODE_SOURCE_PATH/jobs/c4merge_entry.sh
