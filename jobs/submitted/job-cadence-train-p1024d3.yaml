experiment_name: cadence-train-p1024d3
environment:
  dependencies: jobs/requirements.yaml
compute:
  gpus: 8
  gpu_type: GPU_8xH100
max_retries: 0
timeout_minutes: 480
env_variables:
  RUN_NAME: "p1024d3"
  FULL_NAME: "vqvae_owt9_1024_d3"
  CONFIG: "configs/tokenizer_owt9_1024.yaml"
  DATA_NAME: "owt9_gpt2"
  TOKENIZER: "gpt2"
  EXTRA_ARGS: "--set train.scale_dropout_p=0.3 --set run_name=vqvae_owt9_1024_d3"
code_source:
  type: snapshot
  snapshot:
    repo_path: .
command: |
  bash $CODE_SOURCE_PATH/jobs/train_entry.sh
