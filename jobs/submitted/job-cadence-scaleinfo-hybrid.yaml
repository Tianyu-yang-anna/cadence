experiment_name: cadence-scaleinfo-hybrid
environment:
  dependencies: jobs/requirements.yaml
compute:
  gpus: 1
  gpu_type: GPU_1xH100
max_retries: 0
timeout_minutes: 90
env_variables:
  RUN_NAME: "hybrid"
  DATA_NAME: "wikitext103_bert"
  TOKENIZER: "bert-base-uncased"
code_source:
  type: snapshot
  snapshot:
    repo_path: .
command: |
  bash $CODE_SOURCE_PATH/jobs/scaleinfo_entry.sh
