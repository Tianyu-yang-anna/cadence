experiment_name: cadence-arbase-base
environment:
  dependencies: jobs/requirements.yaml
compute:
  gpus: 8
  gpu_type: GPU_8xH100
max_retries: 0
timeout_minutes: 300
env_variables:
  RUN_NAME: "base"
  CONFIG: "configs/ar_baseline_wt103.yaml"
  DATA_NAME: "wikitext103_bert"
  TOKENIZER: "bert-base-uncased"
code_source:
  type: snapshot
  snapshot:
    repo_path: .
command: |
  bash $CODE_SOURCE_PATH/jobs/arbase_entry.sh
