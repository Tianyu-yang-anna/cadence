experiment_name: cadence-planner-v2
environment:
  dependencies: jobs/requirements.yaml
compute:
  gpus: 8
  gpu_type: GPU_8xH100
max_retries: 0
timeout_minutes: 600
env_variables:
  RUN_NAME: "v2"
  FULL_NAME: "planner_owt_v2"
  TOK_FULL_NAME: "vqvae_owt_gpt2hybrid"
  CONFIG: "configs/planner_owt_v2.yaml"
  DATA_NAME: "owt9_gpt2"
  TOKENIZER: "gpt2"
  CODES_NAME: "codes_owt9"
code_source:
  type: snapshot
  snapshot:
    repo_path: .
command: |
  bash $CODE_SOURCE_PATH/jobs/planner_entry.sh
