experiment_name: cadence-dumpcodes-hybrid
environment:
  dependencies: jobs/requirements.yaml
compute:
  gpus: 1
  gpu_type: GPU_1xH100
max_retries: 0
timeout_minutes: 120
env_variables:
  RUN_NAME: "hybrid"
  CONFIG: "configs/vqvae_wikitext_bert.yaml"
  DATA_NAME: "wikitext103_bert"
  TOKENIZER: "bert-base-uncased"
  CODES_NAME: "codes_hybrid"
code_source:
  type: snapshot
  snapshot:
    repo_path: .
command: |
  bash $CODE_SOURCE_PATH/jobs/dumpcodes_entry.sh
