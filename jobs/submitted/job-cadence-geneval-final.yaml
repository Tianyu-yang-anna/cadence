experiment_name: cadence-geneval-final
environment:
  dependencies: jobs/requirements.yaml
compute:
  gpus: 1
  gpu_type: GPU_1xH100
max_retries: 0
timeout_minutes: 300
env_variables:
  AR_RUN: ""
  SKIP_ORACLE: "1"
  TAG: "_final"
  TEMP: "0.8"
  TOPP: "0.9"
  TEST_CFG: "3.0"
  CFGS: ""
code_source:
  type: snapshot
  snapshot:
    repo_path: .
command: |
  bash $CODE_SOURCE_PATH/jobs/geneval_entry.sh
