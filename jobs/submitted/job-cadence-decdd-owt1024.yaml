experiment_name: cadence-decdd-owt1024
environment:
  dependencies: jobs/requirements.yaml
compute:
  gpus: 8
  gpu_type: GPU_8xH100
max_retries: 0
timeout_minutes: 300
env_variables:
  RUN_NAME: "owt9tok1024"
  FULL_NAME: "vqvae_owt9_1024_d5"
  CONFIG: "configs/tokenizer_owt9_1024.yaml"
  DATA_NAME: "owt9_gpt2"
  TOKENIZER: "gpt2"
  STEPS: "20000"
  EXTRA_ARGS: "--set data.num_workers=0"
code_source:
  type: snapshot
  snapshot:
    repo_path: .
command: |
  bash $CODE_SOURCE_PATH/jobs/decdd_entry.sh
