experiment_name: cadence-train-bertD [1,4,16,64,256] 125
environment:
  dependencies: jobs/requirements.yaml
compute:
  gpus: 1
  gpu_type: GPU_1xH100
max_retries: 0
timeout_minutes: 600
env_variables:
  RUN_NAME: "bertD [1,4,16,64,256] 125"
  CONFIG: "configs/vqvae_wikitext_bert.yaml"
  DATA_NAME: "wikitext103_bert"
  TOKENIZER: "bert-base-uncased"
  EXTRA_ARGS: "--set quantizer.scales= --set quantizer.revival.interval="
code_source:
  type: snapshot
  snapshot:
    repo_path: .
command: |
  bash $CODE_SOURCE_PATH/jobs/train_entry.sh
