experiment_name: cadence-planner-mg56ln
environment:
  dependencies: jobs/requirements.yaml
compute:
  gpus: 16
  gpu_type: GPU_8xH100
max_retries: 0
timeout_minutes: 180
env_variables:
  RUN_NAME: "mg56ln"
  FULL_NAME: "planner_prefix_owt2_pqsh_mg56ln"
  SRC_FULL: "planner_prefix_owt2_pqsh_hw56ln"
  TOK_FULL_NAME: "vqvae_owt2_1024_pqsh"
  CONFIG: "configs/planner_prefix_owt2_pqsh.yaml"
  DATA_NAME: "owt2_gpt2"
  CODES_NAME: "codes_owt2_1024_pqsh"
  TRAIN_SCRIPT: "finetune_prefix_maskgit.py"
  EXTRA_ARGS: "--src_run planner_prefix_owt2_pqsh_hw56ln --steps 1000 --set train.lr=5e-5 --set train.warmup_steps=50 --set planner.depth_ar=false --set train.scale_weight=lognormal"
code_source:
  type: snapshot
  snapshot:
    repo_path: .
    allow_uncommitted: true
command: |
  bash $CODE_SOURCE_PATH/jobs/planner_entry.sh
