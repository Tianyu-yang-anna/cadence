experiment_name: cadence-ldiffgen-d64
environment:
  dependencies: jobs/requirements.yaml
compute:
  gpus: 8
  gpu_type: GPU_8xH100
max_retries: 0
timeout_minutes: 480
env_variables:
  RUN_NAME: "d64"
  FULL_NAME: "ldiff_owt2_pqsh"
  TOK_FULL: "vqvae_owt2_1024_pqsh"
  CONFIG: "configs/ldiff_owt2_pqsh.yaml"
  DATA_NAME: "owt2_gpt2"
  STEPS: "64"
  TAG: "_D64"
code_source:
  type: snapshot
  snapshot:
    repo_path: .
command: |
  bash $CODE_SOURCE_PATH/jobs/ldiffgen_entry.sh
