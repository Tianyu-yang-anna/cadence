experiment_name: cadence-train-pqps
environment:
  dependencies: jobs/requirements.yaml
compute:
  gpus: 32
  gpu_type: GPU_8xH100
max_retries: 0
timeout_minutes: 600
env_variables:
  RUN_NAME: "pqps"
  FULL_NAME: "vqvae_owt9_1024_pqps"
  CONFIG: "configs/tokenizer_owt9_1024_pqps.yaml"
  DATA_NAME: "owt9_gpt2"
code_source:
  type: snapshot
  snapshot:
    repo_path: .
command: |
  bash $CODE_SOURCE_PATH/jobs/train_entry.sh
