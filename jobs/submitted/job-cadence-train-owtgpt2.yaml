experiment_name: cadence-train-owtgpt2
environment:
  dependencies: jobs/requirements.yaml
compute:
  gpus: 8
  gpu_type: GPU_8xH100
max_retries: 0
timeout_minutes: 600
env_variables:
  RUN_NAME: "owtgpt2"
  FULL_NAME: "vqvae_owt_gpt2hybrid"
  CONFIG: "configs/tokenizer_owt_gpt2.yaml"
  DATA_NAME: "owt_gpt2"
  TOKENIZER: "gpt2"
code_source:
  type: snapshot
  snapshot:
    repo_path: .
command: |
  bash $CODE_SOURCE_PATH/jobs/train_entry.sh
