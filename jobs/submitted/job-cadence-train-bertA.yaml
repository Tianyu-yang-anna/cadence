experiment_name: cadence-train-bertA
environment:
  dependencies: jobs/requirements.yaml
compute:
  gpus: 1
  gpu_type: GPU_1xH100
max_retries: 0
timeout_minutes: 600
env_variables:
  RUN_NAME: "bertA"
  CONFIG: "configs/vqvae_wikitext_bert.yaml"
  DATA_NAME: "wikitext103_bert"
  TOKENIZER: "bert-base-uncased"
  EXTRA_ARGS: "--set quantizer.scales=[4,8,16,32,64,128,256] --set quantizer.revival.interval=175"
code_source:
  type: snapshot
  snapshot:
    repo_path: .
command: |
  bash $CODE_SOURCE_PATH/jobs/train_entry.sh
