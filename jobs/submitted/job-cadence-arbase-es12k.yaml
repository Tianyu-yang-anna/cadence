experiment_name: cadence-arbase-es12k
environment:
  dependencies: jobs/requirements.yaml
compute:
  gpus: 8
  gpu_type: GPU_8xH100
max_retries: 0
timeout_minutes: 120
env_variables:
  RUN_NAME: "es12k"
  DATA_NAME: "wikitext103_bert"
  TOKENIZER: "bert-base-uncased"
  EXTRA_ARGS: "--set train.max_steps=12000"
code_source:
  type: snapshot
  snapshot:
    repo_path: .
command: |
  bash $CODE_SOURCE_PATH/jobs/arbase_entry.sh
