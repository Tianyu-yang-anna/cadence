timeout_minutes: 120
env_variables:
  RUN_NAME: "hybrid"
  CONFIG: "configs/vqvae_wikitext_bert.yaml"
  DATA_NAME: "wikitext103_bert"
code_source:
  type: snapshot
  snapshot:
    repo_path: .
command: |
  bash $CODE_SOURCE_PATH/jobs/nspp_entry.sh
