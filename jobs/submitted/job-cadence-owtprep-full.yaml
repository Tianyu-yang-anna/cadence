experiment_name: cadence-owtprep-full
environment:
  dependencies: jobs/requirements.yaml
compute:
  gpus: 1
  gpu_type: GPU_1xH100
max_retries: 0
timeout_minutes: 600
env_variables:
  MAX_TOKENS: "9.5e9"
  DATA_OUT: "owt9_gpt2"
code_source:
  type: snapshot
  snapshot:
    repo_path: .
command: |
  bash $CODE_SOURCE_PATH/jobs/owtprep_entry.sh
