experiment_name: cadence-codemerge-cmpso2
environment:
  dependencies: jobs/requirements.yaml
compute:
  gpus: 8
  gpu_type: GPU_8xH100
max_retries: 0
timeout_minutes: 120
env_variables:
  CODES_NAME: "codes_owt2_1024_pqps"
  NSHARDS: "8"
code_source:
  type: snapshot
  snapshot:
    repo_path: .
command: |
  bash $CODE_SOURCE_PATH/jobs/codemerge_entry.sh
