experiment_name: cadence-arbase-aro2
environment:
  dependencies: jobs/requirements.yaml
compute:
  gpus: 8
  gpu_type: GPU_8xH100
max_retries: 0
timeout_minutes: 240
env_variables:
  RUN_NAME: "aro2"
  FULL_NAME: "ar_owt2"
  CONFIG: "configs/ar_baseline_owt2.yaml"
  DATA_NAME: "owt2_gpt2"
code_source:
  type: snapshot
  snapshot:
    repo_path: .
command: |
  bash $CODE_SOURCE_PATH/jobs/arbase_entry.sh
