experiment_name: cadence-arbase-owt9
environment:
  dependencies: jobs/requirements.yaml
compute:
  gpus: 8
  gpu_type: GPU_8xH100
max_retries: 0
timeout_minutes: 600
env_variables:
  RUN_NAME: "owt9"
  CONFIG: "configs/ar_baseline_owt9.yaml"
  DATA_NAME: "owt9_gpt2"
  TOKENIZER: "gpt2"
code_source:
  type: snapshot
  snapshot:
    repo_path: .
command: |
  bash $CODE_SOURCE_PATH/jobs/arbase_entry.sh
