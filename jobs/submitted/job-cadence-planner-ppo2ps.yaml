experiment_name: cadence-planner-ppo2ps
environment:
  dependencies: jobs/requirements.yaml
compute:
  gpus: 32
  gpu_type: GPU_8xH100
max_retries: 0
timeout_minutes: 240
env_variables:
  RUN_NAME: "ppo2ps"
  FULL_NAME: "planner_prefix_owt2_pqps"
  TOK_FULL_NAME: "vqvae_owt2_1024_pqps"
  CONFIG: "configs/planner_prefix_owt2_pqps.yaml"
  DATA_NAME: "owt2_gpt2"
  CODES_NAME: "codes_owt2_1024_pqps"
  TRAIN_SCRIPT: "train_prefix_planner.py"
code_source:
  type: snapshot
  snapshot:
    repo_path: .
command: |
  bash $CODE_SOURCE_PATH/jobs/planner_entry.sh
