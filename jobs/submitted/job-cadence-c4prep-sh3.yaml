experiment_name: cadence-c4prep-sh3
environment:
  dependencies: jobs/requirements.yaml
compute:
  gpus: 1
  gpu_type: GPU_1xH100
max_retries: 0
timeout_minutes: 300
env_variables:
  SHARD: "3"
  NSHARDS: "8"
  DATA_OUT: "c4_gpt2"
  TOKENS_PER_SHARD: "5e9"
code_source:
  type: snapshot
  snapshot:
    repo_path: .
command: |
  bash $CODE_SOURCE_PATH/jobs/c4prep_entry.sh
