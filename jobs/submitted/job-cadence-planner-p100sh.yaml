experiment_name: cadence-planner-p100sh
environment:
  dependencies: jobs/requirements.yaml
compute:
  gpus: 32
  gpu_type: GPU_8xH100
max_retries: 0
timeout_minutes: 600
env_variables:
  RUN_NAME: "p100sh"
  FULL_NAME: "planner_prefix_100m_pqsh"
  TOK_FULL_NAME: "vqvae_owt9_1024_pqsh"
  CONFIG: "configs/planner_prefix_100m_pqsh.yaml"
  DATA_NAME: "owt9_gpt2"
  CODES_NAME: "codes_owt9_1024_pqsh"
  TRAIN_SCRIPT: "train_prefix_planner.py"
code_source:
  type: snapshot
  snapshot:
    repo_path: .
command: |
  bash $CODE_SOURCE_PATH/jobs/planner_entry.sh
